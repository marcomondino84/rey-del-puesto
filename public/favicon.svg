<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="crownGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#78350f" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Fondo redondeado con gradiente idéntico al logo del título -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Corona del Rey del Puesto -->
  <g filter="url(#shadow)">
    <!-- Puntas y cuerpo -->
    <path d="M14 43 L17 25 L26 33 L32 17 L38 33 L47 25 L50 43 Z" fill="url(#crownGold)"/>
    
    <!-- Base inferior -->
    <rect x="14" y="44" width="36" height="5" rx="2" fill="#92400e"/>
    <rect x="15" y="45" width="34" height="2" rx="1" fill="#fef08a" opacity="0.8"/>
    
    <!-- Joyas en las tres puntas -->
    <circle cx="17" cy="24" r="2.8" fill="#ef4444"/>
    <circle cx="17" cy="23.2" r="1" fill="#fecaca"/>
    
    <circle cx="32" cy="16" r="3.2" fill="#3b82f6"/>
    <circle cx="32" cy="15.2" r="1.2" fill="#bfdbfe"/>
    
    <circle cx="47" cy="24" r="2.8" fill="#10b981"/>
    <circle cx="47" cy="23.2" r="1" fill="#a7f3d0"/>
    
    <!-- Gemas en la banda -->
    <circle cx="23" cy="46.5" r="1.5" fill="#ef4444"/>
    <circle cx="32" cy="46.5" r="1.5" fill="#3b82f6"/>
    <circle cx="41" cy="46.5" r="1.5" fill="#10b981"/>
  </g>
</svg>
